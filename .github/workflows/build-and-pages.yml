name: Build firmware and publish installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc git wget make libncurses-dev flex bison gperf python3 python3-pip

      - name: Install official ESP8266 RTOS SDK v3.4
        run: |
          git clone --depth 1 --branch v3.4 https://github.com/espressif/ESP8266_RTOS_SDK.git "$RUNNER_TEMP/ESP8266_RTOS_SDK"
          cd "$RUNNER_TEMP/ESP8266_RTOS_SDK"
          git submodule update --init components/json/cJSON components/lwip/lwip components/mbedtls/mbedtls components/mqtt/esp-mqtt
          ./install.sh
          "$HOME/.espressif/python_env/rtos3.4_py3.10_env/bin/python" -m pip install 'setuptools<81'

      - name: Build firmware
        shell: bash
        run: |
          export IDF_PATH="$RUNNER_TEMP/ESP8266_RTOS_SDK"
          source "$IDF_PATH/export.sh"
          make defconfig BATCH_BUILD=1
          make -j2 BATCH_BUILD=1

      - name: Assemble installer site
        shell: bash
        run: |
          mkdir -p site/firmware
          cp web/index.html site/index.html
          cp build/bootloader/bootloader.bin site/firmware/bootloader.bin
          cp build/partitions_singleapp.bin site/firmware/partitions_singleapp.bin
          cp build/esp8266_ap_station_control.bin site/firmware/firmware.bin
          cat > site/manifest.json <<'JSON'
          {
            "name": "ESP8266 AP Station Control",
            "version": "1.0.0",
            "new_install_prompt_erase": true,
            "builds": [{
              "chipFamily": "ESP8266",
              "parts": [
                {"path": "firmware/bootloader.bin", "offset": 0},
                {"path": "firmware/partitions_singleapp.bin", "offset": 32768},
                {"path": "firmware/firmware.bin", "offset": 65536}
              ]
            }]
          }
          JSON

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

